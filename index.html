
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b0b0b">
    <meta name="description" content="CatUb V1 School Math">

    <title>CatUb V1 - School Math</title>

    <style>
        /* RESET */
        * {
            box-sizing: border-box;
        }

        /* BODY */
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: #0b0b0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        /* PARTICLES */
        #particles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* CONTENT */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* TITLE */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px white, 0 0 20px white;
            }

            to {
                text-shadow: 0 0 25px white, 0 0 40px white;
            }
        }

        /* BUTTON CONTAINER */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 260px;
            max-width: 100%;
        }

        /* BASE BUTTON */
        button {
            padding: 15px;
            font-size: 18px;
            font-family: inherit;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            background: black;
            color: white;

            box-shadow: 0 0 10px rgba(255,255,255,1);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        button:hover {
            transform: scale(1.06);
            box-shadow: 0 0 25px white;
            border-color: white;
        }

        button:focus-visible {
            outline: 2px solid white;
            outline-offset: 5px;
        }

        button:active {
            transform: scale(0.97);
        }

        /* BUTTON TYPES */
        .game,
        .extra, {
            background: black;
            color: white;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .buttons {
                width: min(260px, 90vw);
            }
        }

        /* REDUCED MOTION */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <canvas id="particles" aria-hidden="true"></canvas>

    <main class="content">

        <h1>CatUb V1</h1>

        <div class="buttons">

            <button class="game"
                onclick="navigate('Math2.html')">
                Math Games
            </button>

            <button class="extra"
                onclick="navigate('ExtraMath.html')">
                Extra Math
            </button>

        </div>

    </main>

    <audio
        id="clickSound"
        src="audios/computer-mouse-click-352734.mp3"
        preload="auto">
    </audio>

    <script>
        /* SOUND */
        const audio = document.getElementById("clickSound");

        function clickSound() {
            if (!audio) return;

            audio.currentTime = 0;

            const playback = audio.play();

            if (playback) {
                playback.catch(() => {});
            }
        }

        /* NAVIGATION */
        function navigate(page) {
            clickSound();
            window.location.href = page;
        }

        /* BLACK & WHITE PARTICLES */
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        let particles = [];
        let animationId = null;

        const PARTICLE_COUNT = 100;

        function resize() {
            const dpr = Math.min(
                window.devicePixelRatio || 1,
                2
            );

            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            createParticles();
        }

        function createParticles() {
            particles = Array.from(
                { length: PARTICLE_COUNT },
                () => ({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 2 + 1,
                    dx: (Math.random() - 0.5) * 0.6,
                    dy: (Math.random() - 0.5) * 0.6,
                    alpha: Math.random() * 0.7 + 0.3,
                    white: Math.random() > 0.5
                })
            );
        }

        function animate() {
            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );

            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;

                if (
                    p.x < 0 ||
                    p.x > window.innerWidth
                ) {
                    p.dx *= -1;
                }

                if (
                    p.y < 0 ||
                    p.y > window.innerHeight
                ) {
                    p.dy *= -1;
                }

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.r,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = p.white
                    ? `rgba(255,255,255,${p.alpha})`
                    : `rgba(100,100,100,${p.alpha})`;

                ctx.fill();
            });

            animationId = requestAnimationFrame(animate);
        }

        /* INITIALIZE */
        resize();

        const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        );

        function startParticles() {
            if (!reducedMotion.matches && animationId === null) {
                animate();
            }
        }

        function stopParticles() {
            if (animationId !== null) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }

        startParticles();

        /* RESIZE */
        window.addEventListener("resize", resize);

        /* SAVE PERFORMANCE WHEN TAB IS HIDDEN */
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                stopParticles();
            } else {
                startParticles();
            }
        });

        /* HANDLE MOTION PREFERENCE CHANGES */
        reducedMotion.addEventListener("change", () => {
            if (reducedMotion.matches) {
                stopParticles();
            } else {
                startParticles();
            }
        });
    </script>

</body>
</html>
